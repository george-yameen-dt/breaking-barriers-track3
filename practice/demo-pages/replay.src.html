<title>Cell Network Replay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the recorded network map on the left, one sentence that tells the story on the right, a scrubber underneath. */
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1b1f27; --muted: #5d6573; --line: #d9dde4;
  --signal: #2e7d5b; --weak: #b7791f; --cut: #c0392b; --ai: #3b5bdb; --cover: 59, 91, 219;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11141a; --panel: #181c24; --ink: #e8ebf0; --muted: #98a1b0; --line: #2a303b;
  --signal: #4cc38a; --weak: #e0a243; --cut: #f0605a; --ai: #7d93ff; --cover: 125, 147, 255; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11141a; --panel: #181c24; --ink: #e8ebf0; --muted: #98a1b0; --line: #2a303b;
  --signal: #4cc38a; --weak: #e0a243; --cut: #f0605a; --ai: #7d93ff; --cover: 125, 147, 255; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; }
.wrap { max-width: 1400px; margin: 0 auto; padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; align-items: baseline; }
h1 { margin: 0; font-size: 20px; font-weight: 600; }
.src { color: var(--muted); font-size: 13px; max-width: 70ch; }
.main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(280px, 1.2fr); gap: 32px; align-items: center; }
.map { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.map svg { display: block; width: 100%; height: auto; }
.story { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.steps { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.steps span { display: inline-flex; align-items: center; gap: 7px; }
.steps i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); display: inline-block; }
.steps .done i { background: var(--muted); border-color: var(--muted); }
.steps .now { color: var(--ink); font-weight: 600; }
.steps .now.healthy i { background: var(--signal); border-color: var(--signal); }
.steps .now.broken i { background: var(--cut); border-color: var(--cut); }
.steps .now.fixed i { background: var(--ai); border-color: var(--ai); }
.headline { font-size: clamp(26px, 3.2vw, 40px); font-weight: 600; line-height: 1.15; text-wrap: balance; }
.story.broken .headline { color: var(--cut); }
.sub { font-size: 17px; line-height: 1.55; color: var(--muted); max-width: 46ch; }
.story.fixed .sub { color: var(--ink); }
.meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.open { align-self: flex-start; font-size: 14px; color: var(--ai); text-decoration: none; border: 1px solid var(--ai); border-radius: 6px; padding: 7px 12px; }
.open:hover, .open:focus-visible { background: color-mix(in srgb, var(--ai) 12%, transparent); outline: none; }
.key { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding-top: 12px; border-top: 1px solid var(--line); }
.key span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.bar { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
button { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
button[aria-pressed="true"] { border-color: var(--ai); color: var(--ai); }
.track { position: relative; height: 48px; }
.track input { position: absolute; inset: 8px 0 auto; width: 100%; margin: 0; accent-color: var(--ai); }
.marks { position: absolute; inset: 0; pointer-events: none; }
.marks b { position: absolute; top: 0; width: 2px; height: 10px; background: var(--muted); }
.marks b.cut { background: var(--cut); } .marks b.ai { background: var(--ai); }
.marks em.low { top: 34px; }
.marks em { position: absolute; top: 22px; font-style: normal; font-size: 11px; color: var(--muted); white-space: nowrap; transform: translateX(-50%); }
.clock { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
svg .tw { stroke: var(--muted); stroke-width: 2.2; fill: none; stroke-linecap: round; }
svg .tw-top { fill: var(--ai); }
svg .tw-name { font: 600 14px var(--sans); fill: var(--muted); text-anchor: middle; }
svg .range { fill: none; stroke: var(--ai); stroke-opacity: .35; stroke-dasharray: 3 6; }
svg .ph { stroke: var(--panel); stroke-width: 2; }
svg .ph-id { font: 600 11px var(--mono); fill: #fff; text-anchor: middle; dominant-baseline: central; }
svg .off { fill: var(--panel); stroke: var(--muted); }
svg .off + .ph-id { fill: var(--muted); }
svg .ring { fill: none; stroke: var(--cut); stroke-width: 2; }
@media (prefers-reduced-motion: no-preference) { svg .ring { animation: ring 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; } }
@keyframes ring { from { transform: scale(1); opacity: .8 } to { transform: scale(2.2); opacity: 0 } }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } .bar { grid-template-columns: auto auto minmax(0, 1fr); } .clock { grid-column: 1 / -1; } }
</style>

<div class="wrap">
  <header>
    <h1>Cell network · recorded run</h1>
    <div class="src" id="src"></div>
  </header>
  <div class="main">
    <div class="map"><svg id="map" role="img" aria-label="Recorded cell network: towers, phones and their connections"></svg></div>
    <div class="story" id="story">
      <div class="steps" id="steps"></div>
      <div class="headline" id="headline"></div>
      <div class="sub" id="sub"></div>
      <div class="meta" id="meta"></div>
      <a class="open" id="open" target="_blank" rel="noopener"></a>
      <div class="key">
        <span><i class="dot" style="background:var(--signal)"></i>has signal</span>
        <span><i class="dot" style="background:var(--weak)"></i>weak</span>
        <span><i class="dot" style="background:var(--cut)"></i>cut off</span>
        <span>shading = tower signal strength</span>
      </div>
    </div>
  </div>
  <div class="bar">
    <button id="play" aria-label="Pause">Pause</button>
    <div id="speeds"></div>
    <div class="track"><input id="scrub" type="range" min="0" step="0.1" aria-label="Replay position"><div class="marks" id="marks"></div></div>
    <span class="clock" id="clock"></span>
  </div>
</div>

<script>/*DATA*/</script>
<script>
(() => {
  const D = window.DEMO, M = D.marks, S = 3.2, PAD = 26;
  const [MW, MH] = D.map; // simulator area 200 x 300, drawn on its side
  const W = MH * S + PAD * 2, H = MW * S + PAD * 2;
  const px = (y) => PAD + y * S, py = (x) => PAD + x * S;
  const svg = document.getElementById("map");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; };
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

  // Signal strength shading, with the simulator's own radio model (Okumura-Hata, 2.5 GHz, 30 dBm).
  function coverage() {
    const f = 2500, hu = 1.5, hb = 50, ch = 0.8 + (1.1 * Math.log10(f) - 0.7) * hu - 1.56 * Math.log10(f);
    const base = 69.55 - ch + 26.16 * Math.log10(f) - 13.82 * Math.log10(hb), slope = 44.9 - 6.55 * Math.log10(hb);
    const margin = (d) => 10 * Math.log10((10 ** ((30 - (base + slope * Math.log10(d + 1e-16))) / 10) / 1e-9) / 2e-8);
    const c = document.createElement("canvas"); c.width = MH * 2; c.height = MW * 2;
    const g = c.getContext("2d"), rgb = css("--cover") || "59, 91, 219";
    for (let r = 0; r < MW; r += 2) for (let q = 0; q < MH; q += 2) {
      let best = -1e9; for (const [, tx, ty] of D.towers) best = Math.max(best, margin(Math.hypot(r + 1 - tx, q + 1 - ty)));
      if (best <= 0) continue;
      g.fillStyle = `rgba(${rgb}, ${(0.03 + Math.min(1, best / 40) * 0.16).toFixed(3)})`; g.fillRect(q * 2, r * 2, 4, 4);
    }
    return c.toDataURL();
  }
  let covImg;
  function drawStatic() {
    svg.innerHTML = "";
    covImg = el("image", { href: coverage(), x: PAD, y: PAD, width: MH * S, height: MW * S, preserveAspectRatio: "none" });
    for (const [name, x, y, range] of D.towers) el("circle", { cx: px(y), cy: py(x), r: range * S, class: "range" });
    svg.appendChild(document.createElementNS(NS, "g")).id = "links";
    for (const [name, x, y] of D.towers) {
      const g = el("g", { transform: `translate(${px(y)} ${py(x)})` });
      el("path", { d: "M-10 -14 A15 15 0 0 0 -10 4 M10 -14 A15 15 0 0 1 10 4", class: "tw" }, g);
      el("path", { d: "M0 -6 L-8 18 M0 -6 L8 18 M-5 9 L5 9", class: "tw" }, g);
      el("circle", { cy: -6, r: 4.5, class: "tw-top" }, g);
      el("text", { y: 36, class: "tw-name" }, g).textContent = name;
    }
    svg.appendChild(document.createElementNS(NS, "g")).id = "phones";
  }

  const T = D.frames.map((f) => f.t);
  function frameAt(t) { let lo = 0, hi = T.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (T[m] <= t) lo = m; else hi = m - 1; } return lo; }
  const colorOf = (state, rate) => state === 1 ? "var(--cut)" : state === 2 ? null : rate >= 0.5 ? "var(--signal)" : "var(--weak)";

  function drawFrame(t) {
    const i = frameAt(t), a = D.frames[i], b = D.frames[Math.min(i + 1, D.frames.length - 1)];
    const k = b.t > a.t ? Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t))) : 0;
    const prev = new Map(a.p.map((p) => [p[0], p]));
    const links = document.getElementById("links"), phones = document.getElementById("phones");
    links.innerHTML = ""; phones.innerHTML = "";
    for (const p of b.p) {
      const q = prev.get(p[0]) || p, x = q[1] + (p[1] - q[1]) * k, y = q[2] + (p[2] - q[2]) * k;
      const color = colorOf(p[3], p[5]);
      for (const ti of p[4]) { const tw = D.towers[ti]; if (tw) el("line", { x1: px(y), y1: py(x), x2: px(tw[2]), y2: py(tw[1]), stroke: color || "var(--muted)", "stroke-width": 1.5, "stroke-opacity": .5 }, links); }
      const g = el("g", { transform: `translate(${px(y)} ${py(x)})` }, phones);
      if (p[3] === 1) el("circle", { r: 12, class: "ring" }, g);
      el("circle", color ? { r: 12, class: "ph", fill: color } : { r: 12, class: "ph off" }, g);
      el("text", { class: "ph-id" }, g).textContent = p[0];
    }
    return a;
  }

  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  const when = new Date(D.recordedAt);
  document.getElementById("src").textContent =
    `Recorded live from Dynatrace (${D.tenant}) on ${when.toLocaleDateString("en-US", { month: "short", day: "numeric" })} at ${when.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}. Real simulator steps, real problem ${D.problem}, Claude's real answer.`;
  const open = document.getElementById("open");
  open.href = D.problemUrl; open.textContent = `Open ${D.problem} in Dynatrace (needs VPN)`;

  function story(t, f) {
    const phase = t < M.v2On ? "healthy" : t < M.fixed ? "broken" : "fixed";
    const order = ["healthy", "broken", "fixed"], at = order.indexOf(phase);
    document.getElementById("steps").innerHTML = [["healthy", "Healthy"], ["broken", "Broken"], ["fixed", "Fixed by AI"]]
      .map(([p, l], j) => `<span class="${j === at ? "now " + p : j < at ? "done" : ""}"><i></i>${l}</span>`).join("");
    const calls = f.p.filter((p) => p[5] < 0.1).length;
    let h, s, m = "";
    if (phase === "healthy") { h = "Every phone in range has signal."; s = "Model v1 picks a tower for each of the 15 phones. Dynatrace sees every step."; }
    else if (phase === "broken") {
      h = f.d > 0 ? `Model v2 cut off ${f.d} phone${f.d === 1 ? "" : "s"}.` : "Model v2 is live.";
      s = t < M.problem + 60 ? `WhatsApp calls fail on ${calls} of ${f.p.length} phones. Dynatrace is spotting it.`
        : `Dynatrace opened ${D.problem} on the cell network. WhatsApp calls fail on ${calls} of ${f.p.length} phones. Claude is on it.`;
    } else {
      h = f.d === 0 ? "Claude rolled back to v1. Every phone is back." : "Claude rolled back to v1.";
      s = `“${D.advice.summary}”`;
      m = `${D.advice.model} · answered in ${D.advice.secs} s · ${D.advice.tokens.toLocaleString("en-US")} tokens · $${D.advice.cost.toFixed(4)}`;
    }
    const st = document.getElementById("story"); st.className = "story " + phase;
    document.getElementById("headline").textContent = h; document.getElementById("sub").textContent = s;
    document.getElementById("meta").textContent = m;
  }

  const scrub = document.getElementById("scrub"); scrub.max = M.end;
  document.getElementById("marks").innerHTML = [[M.v2On, "v2 live", ""], [M.problem, D.problem, "cut"], [M.fixed, "Claude rolls back", "ai"]]
    .map(([t, l, c], j) => `<b class="${c}" style="left:${(t / M.end) * 100}%"></b><em class="${j === 1 ? "low" : ""}" style="left:${Math.min(92, Math.max(6, (t / M.end) * 100))}%">${l}</em>`).join("");

  let t = 0, playing = true, speed = 2, last = performance.now();
  const speeds = document.getElementById("speeds");
  for (const v of [1, 2, 4]) { const bt = document.createElement("button"); bt.textContent = v + "×"; bt.setAttribute("aria-pressed", v === speed); bt.onclick = () => { speed = v; [...speeds.children].forEach((c) => c.setAttribute("aria-pressed", c === bt)); }; speeds.appendChild(bt); }
  const play = document.getElementById("play");
  play.onclick = () => { playing = !playing; play.textContent = playing ? "Pause" : "Play"; play.setAttribute("aria-label", play.textContent); };
  scrub.oninput = () => { t = +scrub.value; };
  function tick(now) {
    if (playing) { t += ((now - last) / 1000) * speed; if (t > M.end) t = 0; }
    last = now;
    const f = drawFrame(t); story(t, f);
    scrub.value = t; document.getElementById("clock").textContent = `${fmt(t)} / ${fmt(M.end)}`;
    requestAnimationFrame(tick);
  }
  drawStatic();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawStatic);
  requestAnimationFrame(tick);
})();
</script>
